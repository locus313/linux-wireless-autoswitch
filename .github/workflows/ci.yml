name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats
      - name: Shellcheck
        run: shellcheck 70-wifi-autoswitch install.sh
      - name: BATS
        run: bats tests
